name: Build HabilitesRandom

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    if: github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build mod and run tests
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish failure details
        if: failure()
        shell: bash
        run: |
          {
            echo '## HabilitesRandom build failure'
            echo '### JUnit failures'
            if compgen -G "build/test-results/test/*.xml" > /dev/null; then
              grep -hE '<testsuite|<failure|<error' build/test-results/test/*.xml || true
            else
              echo 'No JUnit XML was produced.'
            fi
            echo '### Gradle log tail'
            if [ -f gradle-build.log ]; then tail -n 180 gradle-build.log; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload development jars
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: habilitesrandom-dev
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish development build to this branch
        if: success() && github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip ci]')
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'HabilitesRandom-*.jar' ! -name '*sources*' | head -n 1)"
          if [ -z "$JAR" ]; then echo 'No remapped development jar found'; exit 1; fi
          mkdir -p dev-builds
          cp "$JAR" dev-builds/HabilitesRandom-0.1.0+26.3-dev.jar
          (cd dev-builds && sha256sum HabilitesRandom-0.1.0+26.3-dev.jar > HabilitesRandom-0.1.0+26.3-dev.jar.sha256)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git add dev-builds
          if git diff --cached --quiet; then
            echo 'Development build already current'
          else
            git commit -m 'Add verified HabilitesRandom development build [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: habilitesrandom-test-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
