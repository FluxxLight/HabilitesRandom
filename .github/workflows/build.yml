name: Build HabilitesRandom

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod and run tests
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish failure details
        if: failure()
        shell: bash
        run: |
          {
            echo '## HabilitesRandom build failure'
            echo '### JUnit failures'
            if compgen -G "build/test-results/test/*.xml" > /dev/null; then
              grep -hE '<testsuite|<failure|<error' build/test-results/test/*.xml || true
            else
              echo 'No JUnit XML was produced.'
            fi
            echo '### Gradle log tail'
            if [ -f gradle-build.log ]; then tail -n 180 gradle-build.log; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload development jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: habilitesrandom-dev
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: habilitesrandom-test-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
